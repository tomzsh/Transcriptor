commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
sherpa-onnx = { module = "com.github.k2-fsa.sherpa-onnx:sherpa-onnx", version.ref = "sherpaOnnx" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
junit = { module = "junit:junit", version.ref = "junit" }
test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
